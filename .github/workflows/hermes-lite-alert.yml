name: hermes-lite alert (manuel)

# Alerte manuelle : dispatche hermes-lite sur une PR précise.
# Usage : Actions → hermes-lite alert → Run workflow → pr_number.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numéro de PR'
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: hermes-lite-alert-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  alert:
    name: hermes-lite-alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatcher hermes-lite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/hermes-lite.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"pr_number\":\"${{ inputs.pr_number }}\"}}"
