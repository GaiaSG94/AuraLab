# File de merge Mergify — LabKit (AuraLab).
#
# Le dépôt démarre sans CI ni gate : les queue_conditions n'exigent donc
# aucun check inexistant. Quand le socle CI arrivera (ci-budget,
# hermes-lite — cf. w-SpaceInvader), ajouter dans queue_conditions :
#   - check-success = "ci-budget"
# (budget CI 5 min, règle user 2026-10-24).
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "30 seconds"
    max_checks_retries: 1
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # Pas de CI pour l'instant : la spéculation reste bornée à 4, ajustable
  # quand les workers/checks arriveront.
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
